<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" role="img" aria-label="Akira AI Voice Assistant &amp; Desktop Studio">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="50%" stop-color="#0d1018"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="4" y="4" width="852" height="302" rx="20" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="852" height="302" rx="20" fill="url(#gridPattern)"/>
  <rect x="4" y="4" width="852" height="302" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2.2" stroke-opacity="0.85"/>
  <rect x="12" y="12" width="836" height="286" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <path d="M24 42 L24 20 L46 20" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M814 20 L836 20 L836 42" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M24 268 L24 290 L46 290" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M814 290 L836 290 L836 268" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>

  <g font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif">
    <!-- Wide pill so v5.1.0 fits comfortably -->
    <rect x="42" y="38" width="380" height="30" rx="15" fill="#facc15" fill-opacity="0.1" stroke="#facc15" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="62" cy="53" r="4.5" fill="#facc15"/>
    <text x="78" y="58" fill="#fef08a" font-size="13" font-weight="700" letter-spacing="1.8">AUTONOMOUS DESKTOP AI • v5.1.0</text>

    <text x="40" y="136" fill="url(#titleGrad)" font-size="78" font-weight="900" letter-spacing="10">AKIRA</text>

    <text x="44" y="176" fill="#e2e8f0" font-size="20.5" font-weight="600" letter-spacing="0.3">
      Privacy-First AI Voice Assistant &amp; Multimodal Studio
    </text>
    <text x="44" y="204" fill="#94a3b8" font-size="14.5">
      Local ONNX Speech, Face ID &amp; Gestures  ➔  Hybrid Multi-LLM Core  ➔  Cinema, Music &amp; TG Hub
    </text>

    <g font-size="12.5" font-weight="600">
      <rect x="44" y="232" width="174" height="34" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#facc15" stroke-opacity="0.5"/>
      <text x="131" y="254" text-anchor="middle" fill="#fde047">⚡ Local ONNX + GPU</text>

      <rect x="230" y="232" width="180" height="34" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#fb923c" stroke-opacity="0.5"/>
      <text x="320" y="254" text-anchor="middle" fill="#fdba74">🎨 10-File Studio UI</text>

      <rect x="422" y="232" width="186" height="34" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#67e8f9" stroke-opacity="0.5"/>
      <text x="515" y="254" text-anchor="middle" fill="#67e8f9">🪟 Win &amp; 🐧 Linux Mint</text>

      <rect x="620" y="232" width="196" height="34" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#f43f5e" stroke-opacity="0.5"/>
      <text x="718" y="254" text-anchor="middle" fill="#fda4af">🎙️ Whisper &amp; Voiceprint</text>
    </g>
  </g>
</svg>
