<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Akira AI Voice Assistant &amp; Desktop Studio">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="50%" stop-color="#0d1018"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15">
        <animate attributeName="stop-color" values="#facc15;#fb923c;#f43f5e;#67e8f9;#facc15" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#fb923c">
        <animate attributeName="stop-color" values="#fb923c;#f43f5e;#67e8f9;#facc15;#fb923c" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#67e8f9">
        <animate attributeName="stop-color" values="#67e8f9;#facc15;#fb923c;#f43f5e;#67e8f9" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.95">
        <animate attributeName="stop-color" values="#facc15;#fb923c;#67e8f9;#f43f5e;#facc15" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="38%" stop-color="#f59e0b" stop-opacity="0.45">
        <animate attributeName="stop-color" values="#f59e0b;#f43f5e;#38bdf8;#fbbf24;#f59e0b" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="72%" stop-color="#f43f5e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090b12" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#facc15">
        <animate attributeName="stop-color" values="#facc15;#fb923c;#67e8f9;#f43f5e;#facc15" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background & subtle cyber grid -->
  <rect x="6" y="6" width="1188" height="348" rx="22" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="1188" height="348" rx="22" fill="url(#gridPattern)"/>

  <!-- Outer animated gradient frame -->
  <rect x="6" y="6" width="1188" height="348" rx="22" fill="none" stroke="url(#borderGrad)" stroke-width="2.2" stroke-opacity="0.85"/>
  <rect x="14" y="14" width="1172" height="332" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Corner HUD brackets -->
  <path d="M28 46 L28 24 L50 24" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M1150 24 L1172 24 L1172 46" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M28 314 L28 336 L50 336" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M1150 336 L1172 336 L1172 314" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ambient orb halo -->
  <circle cx="205" cy="180" r="135" fill="url(#orbGlow)">
    <animate attributeName="r" values="125;142;125" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating orbital rings -->
  <g transform="translate(205, 180)">
    <ellipse rx="96" ry="34" fill="none" stroke="url(#borderGrad)" stroke-width="1.6" stroke-opacity="0.7" transform="rotate(-24)">
      <animateTransform attributeName="transform" type="rotate" from="-24 0 0" to="336 0 0" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="84" ry="28" fill="none" stroke="#67e8f9" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="6 8" transform="rotate(32)">
      <animateTransform attributeName="transform" type="rotate" from="32 0 0" to="-328 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="54" fill="url(#orbCore)" filter="url(#softGlow)">
      <animate attributeName="r" values="52;56;52" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-16" cy="-16" r="14" fill="#ffffff" fill-opacity="0.45"/>
  </g>

  <!-- Right side typography -->
  <g font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif">
    <!-- Top eyebrow tag -->
    <rect x="370" y="54" width="295" height="28" rx="14" fill="#facc15" fill-opacity="0.1" stroke="#facc15" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="388" cy="68" r="4.5" fill="#facc15">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="402" y="73" fill="#fef08a" font-size="12.5" font-weight="700" letter-spacing="1.8">AUTONOMOUS DESKTOP AI • v5.1.0</text>

    <!-- Main title -->
    <text x="368" y="156" fill="url(#titleGrad)" font-size="82" font-weight="900" letter-spacing="10">AKIRA</text>

    <!-- Subtitle -->
    <text x="372" y="198" fill="#e2e8f0" font-size="21" font-weight="600" letter-spacing="0.4">
      Privacy-First AI Voice Assistant &amp; Multimodal Studio
    </text>
    <text x="372" y="226" fill="#94a3b8" font-size="15.5">
      Local ONNX Speech, Face ID &amp; Gestures  ➔  Hybrid Multi-LLM Core  ➔  Cinema, Music &amp; Telegram Hub
    </text>

    <!-- Feature pills -->
    <g font-size="12.5" font-weight="600">
      <rect x="372" y="256" width="166" height="32" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#facc15" stroke-opacity="0.5"/>
      <text x="455" y="277" text-anchor="middle" fill="#fde047">⚡ Local ONNX + GPU</text>

      <rect x="550" y="256" width="176" height="32" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#fb923c" stroke-opacity="0.5"/>
      <text x="638" y="277" text-anchor="middle" fill="#fdba74">🎨 10-File Studio UI</text>

      <rect x="738" y="256" width="176" height="32" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#67e8f9" stroke-opacity="0.5"/>
      <text x="826" y="277" text-anchor="middle" fill="#67e8f9">🪟 Win &amp; 🐧 Linux Mint</text>

      <rect x="926" y="256" width="194" height="32" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#f43f5e" stroke-opacity="0.5"/>
      <text x="1023" y="277" text-anchor="middle" fill="#fda4af">🎙️ Whisper &amp; Voiceprint</text>
    </g>
  </g>
</svg>
