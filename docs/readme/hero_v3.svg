<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Akira AI Voice Assistant &amp; Desktop Studio">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="50%" stop-color="#0d1018"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <radialGradient id="logoHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090b12" stop-opacity="0"/>
    </radialGradient>

    <!-- Exact gradients of the orbital Akira icon -->
    <linearGradient id="g_inner" x1="15%" y1="35%" x2="92%" y2="48%">
      <stop offset="0%" stop-color="#581776"/>
      <stop offset="36%" stop-color="#5e2aa8"/>
      <stop offset="68%" stop-color="#3e55df"/>
      <stop offset="100%" stop-color="#2e7ef5"/>
    </linearGradient>

    <linearGradient id="g_inner_crest" x1="15%" y1="15%" x2="88%" y2="75%">
      <stop offset="0%" stop-color="#7c2282"/>
      <stop offset="50%" stop-color="#5928a0"/>
      <stop offset="100%" stop-color="#3446c8"/>
    </linearGradient>

    <linearGradient id="g_left_loop" x1="15%" y1="10%" x2="55%" y2="95%">
      <stop offset="0%" stop-color="#b5093b"/>
      <stop offset="65%" stop-color="#c30738"/>
      <stop offset="100%" stop-color="#ba0836"/>
    </linearGradient>

    <linearGradient id="g_top_left" x1="65%" y1="0%" x2="25%" y2="100%">
      <stop offset="0%" stop-color="#a13478"/>
      <stop offset="42%" stop-color="#c7164b"/>
      <stop offset="78%" stop-color="#8b175d"/>
      <stop offset="100%" stop-color="#57196a"/>
    </linearGradient>

    <linearGradient id="g_right_low" x1="88%" y1="8%" x2="18%" y2="95%">
      <stop offset="0%" stop-color="#efb268"/>
      <stop offset="42%" stop-color="#ab77b8"/>
      <stop offset="78%" stop-color="#4755e8"/>
      <stop offset="100%" stop-color="#502bb4"/>
    </linearGradient>

    <linearGradient id="g_front_ribbon" x1="4%" y1="80%" x2="94%" y2="20%">
      <stop offset="0%" stop-color="#c60834"/>
      <stop offset="28%" stop-color="#981b6e"/>
      <stop offset="56%" stop-color="#3a52ec"/>
      <stop offset="76%" stop-color="#6c6fd4"/>
      <stop offset="100%" stop-color="#e8a46c"/>
    </linearGradient>

    <linearGradient id="g_right_top" x1="0%" y1="12%" x2="100%" y2="82%">
      <stop offset="0%" stop-color="#d26f64"/>
      <stop offset="46%" stop-color="#f2b658"/>
      <stop offset="82%" stop-color="#f6c264"/>
      <stop offset="100%" stop-color="#e59f66"/>
    </linearGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="6" y="6" width="1188" height="348" rx="22" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="1188" height="348" rx="22" fill="url(#gridPattern)"/>
  <rect x="6" y="6" width="1188" height="348" rx="22" fill="none" stroke="url(#borderGrad)" stroke-width="2.2" stroke-opacity="0.85"/>
  <rect x="14" y="14" width="1172" height="332" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <path d="M28 46 L28 24 L50 24" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M1150 24 L1172 24 L1172 46" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M28 314 L28 336 L50 336" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M1150 336 L1172 336 L1172 314" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left: Exact orbital gradient logo centered at (200, 180) -->
  <circle cx="200" cy="180" r="138" fill="url(#logoHalo)"/>
  <g transform="translate(200, 180) scale(0.49) translate(-511, -285)">
    <path d="M 332 268 C 282 302, 266 362, 286 402 L 352 406 C 306 385, 298 318, 342 284 Z"
          fill="url(#g_left_loop)"/>

    <path d="M 366 174 C 414 104, 550 106, 626 184 C 674 234, 668 326, 610 388
             C 538 458, 405 450, 355 375 C 325 328, 336 230, 366 174 Z
             M 412 222 C 384 268, 396 340, 448 372 C 502 406, 578 384, 610 322
             C 636 270, 622 204, 568 174 C 512 142, 442 168, 412 222 Z"
          fill="url(#g_inner)" fill-rule="evenodd"/>

    <path d="M 378 238 C 398 156, 488 126, 566 156 C 618 176, 650 226, 654 290
             C 638 228, 600 184, 546 168 C 478 148, 406 180, 384 248 Z"
          fill="url(#g_inner_crest)" opacity="0.78"/>

    <path d="M 518 104 C 436 86, 346 136, 322 238 C 302 326, 348 418, 448 438
             C 386 394, 366 306, 385 224 C 402 150, 456 110, 518 104 Z"
          fill="url(#g_top_left)"/>

    <path d="M 702 224 C 728 314, 662 422, 566 460 C 516 479, 470 472, 444 456
             C 514 466, 588 424, 632 346 C 660 296, 668 250, 678 214 Z"
          fill="url(#g_right_low)"/>

    <path d="M 277 354 C 276 444, 390 470, 502 426 C 600 388, 682 296, 712 182
             L 682 172 C 656 276, 578 362, 476 396 C 384 426, 294 402, 277 354 Z"
          fill="url(#g_front_ribbon)"/>

    <path d="M 486 155 C 578 104, 696 116, 742 184 C 756 205, 748 258, 700 312
             C 696 254, 682 198, 638 168 C 594 138, 534 142, 486 155 Z"
          fill="url(#g_right_top)"/>
  </g>

  <!-- Right side typography -->
  <g font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif">
    <rect x="370" y="54" width="388" height="30" rx="15" fill="#facc15" fill-opacity="0.1" stroke="#facc15" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="390" cy="69" r="4.5" fill="#facc15"/>
    <text x="406" y="74" fill="#fef08a" font-size="13" font-weight="700" letter-spacing="1.8">AUTONOMOUS DESKTOP AI • v5.1.0</text>

    <text x="368" y="156" fill="url(#titleGrad)" font-size="82" font-weight="900" letter-spacing="10">AKIRA</text>

    <text x="372" y="198" fill="#e2e8f0" font-size="21" font-weight="600" letter-spacing="0.4">
      Privacy-First AI Voice Assistant &amp; Multimodal Studio
    </text>
    <text x="372" y="226" fill="#94a3b8" font-size="15.5">
      Local ONNX Speech, Face ID &amp; Gestures  ➔  Hybrid Multi-LLM Core  ➔  Cinema, Music &amp; Telegram Hub
    </text>

    <g font-size="12.5" font-weight="600">
      <rect x="372" y="256" width="166" height="32" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#facc15" stroke-opacity="0.5"/>
      <text x="455" y="277" text-anchor="middle" fill="#fde047">⚡ Local ONNX + GPU</text>

      <rect x="550" y="256" width="176" height="32" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#fb923c" stroke-opacity="0.5"/>
      <text x="638" y="277" text-anchor="middle" fill="#fdba74">🎨 10-File Studio UI</text>

      <rect x="738" y="256" width="176" height="32" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#67e8f9" stroke-opacity="0.5"/>
      <text x="826" y="277" text-anchor="middle" fill="#67e8f9">🪟 Win &amp; 🐧 Linux Mint</text>

      <rect x="926" y="256" width="194" height="32" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#f43f5e" stroke-opacity="0.5"/>
      <text x="1023" y="277" text-anchor="middle" fill="#fda4af">🎙️ Whisper &amp; Voiceprint</text>
    </g>
  </g>
</svg>
